# Computer Speak: the install reported in a plain, formal register, one line per step. Installers
# speak in it when given --computer-speak.
#
# Every event is a list of phrases; each time it happens one is picked at random. The installer
# fills in the {placeholders} each event lists; a phrase can leave any of them out.
version = 1
name = "Computer Speak"

# Computer Speak never interjects (see toiling-through-hell.toml's [interjection]).

[phrases]
begin = ["Installation of {what} initiated. Target directory: {place}."]
download = ["Downloading {name} ({size})."]
downloaded = ["Download of {name} complete."]
verified = ["Integrity check passed for {name}."]
corrupted = ["Integrity check failed for {name}: checksum mismatch. The file has been discarded."]
found = ["Located {what} at {place}."]
unpack = ["Extracting {name} to {place}."]
copy = ["Copying {what} to {place}."]
skip = ["{what} is already present at {place}. No action taken."]
link = ["Configured {what} at {place}."]
path = ["Added {place} to the PATH environment variable."]
run = ["Executing: {command}"]
ran = ["Process completed successfully: {command}"]
problem = ["Error: {problem}"]
done = ["Installation of {what} completed successfully."]
journal = ["A complete log of this operation has been written to {place}."]
shortcut = ["Created a shortcut for {what} at {place}."]

ready = ["{what} is ready to play: {command}"]
confirm = ["Are you sure? [y/n]"]
unclear = ["y or n; after a y, any of the flags above (y --flag ...)"]
unknown_flags = ["Not one of this script's flags: {flags}"]
declined = ["Nothing was done."]
pause = ["Press Enter to continue."]
detected = ["Detected {what}: {doing}."]
undetected = ["{what} was not detected. {instead}"]
# The colour of each event's line, as terminal SGR codes (36 cyan, 32 green, 34 blue, 31 red,
# 1 bold, 2 dim; joined with ;): a terminal's own. `other` is what other programs print, `section`
# the --- Section --- separators, `warning` the warning before the question.
[colors]
begin = "1;36"
download = "36"
downloaded = "36"
verified = "32"
corrupted = "1;31"
found = "34"
unpack = "34"
copy = "34"
skip = "2"
link = "34"
path = "34"
run = "2;36"
ran = "2;32"
problem = "1;31"
done = "1;32"
journal = "2"
shortcut = "34"
ready = "1;32"
detected = "1;32"
undetected = "2;33"
confirm = "1;36"
unclear = "33"
unknown_flags = "33"
declined = "2"
pause = "1"
other = "2"
section = "1;33"
warning = "1;31"

# What each part of the work is called in its --- Section --- separator
[sections]
warning = "Warning"
build = "Build"
pack = "Packaging"
install = "Installation"
download = "Downloads"
setup = "Configuration"
song = "Audio"
weapons = "Weapons"
shortcuts = "Shortcuts"
play = "Launch"

# Lines that only repeat what was just said (an empty phrase swallows them: written down, not shown)
[[rewrite]]
pattern = '^(Kept what .* says|Your usual loadout .* is missing.*|Data are loaded, start creating Blender stuff|Failed to register scene update handler|Read blend: .*|doomify: done)$'
phrases = [""]

[[rewrite]]
pattern = '^\s*Building \['
phrases = ["{line}"]
color = "36"

[[rewrite]]
pattern = '^(Cut .* sprites|Wrote |Packing |Blender quit)'
phrases = ["{line}"]
color = "34"

# What other programs print is left as it is, only coloured: warnings and errors stand out.
[[rewrite]]
pattern = '^\s*warning: '
phrases = ["{line}"]
color = "33"

[[rewrite]]
pattern = '^\s*error(?:\[\w+\])?: '
phrases = ["{line}"]
color = "1;31"

[[rewrite]]
pattern = '^\s*Finished '
phrases = ["{line}"]
color = "32"

[fallback]
format = "  {line}"
