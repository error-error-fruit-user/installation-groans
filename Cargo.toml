[package]
name = "installation-groans"
version = "0.1.0"
edition = "2024"
license = "0BSD"
description = "A ratatui library for the workspace's installers, speaking in installation-groans' voices"

[workspace]
members = [".", "macros"]

[dependencies]
installation-groans-macros = { path = "macros", version = "0.1.0" }
ratatui = "0.30.2"
toml = "1.1.8"
regex-lite = "0.1"
ureq = "3.4.2"
blake3 = "1.8.7"
sha2 = "0.10"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
