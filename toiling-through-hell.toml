# Toiling Through Hell: the install as your computer's descent through hell, dragging each file up
# out of the pit on its hands and knees. The voice installers speak in unless told --computer-speak.
#
# Every event is a list of phrases; each time it happens one is picked at random. The installer
# fills in the {placeholders} each event lists; a phrase can leave any of them out.
version = 1
name = "Toiling Through Hell"

# Now and then, after a step, something else speaks through the machine: `chance` of the time (0
# to 1), in `color` (red, yellow, green, blue, magenta, cyan, white), one of its `phrases`.
[interjection]
chance = 0.03
color = "red"
phrases = ["MUST COMPLETE THE RITUAL"]

[phrases]
# {what} is being installed in {place}
begin = [
    "Your computer takes its first step into the pit, bound for {place}, to install {what}.",
    "The gates groan open. {what} is somewhere below; {place} is where it must be dragged.",
    "Abandon all idle cycles, ye who enter here: installing {what} in {place}.",
    "The fans spin up like a dying breath. Down we go, to raise {what} in {place}.",
    "Somewhere a hard drive weeps. {what} is coming to {place}, whether it likes it or not.",
]
# {name} is downloaded, {size} of it
download = [
    "Hauling {name} up from the depths, {size} of it, link by burning link...",
    "Clawing {name} out of the wire, {size} heavier with every packet...",
    "The network howls. {name} ({size}) is torn from it one byte at a time...",
    "Dragging {name} through the fire, all {size} of it...",
    "A chain of {size} rattles up out of the dark: {name}, coming...",
]
# {name} arrived whole
downloaded = [
    "{name} crawls out of the pit, scorched but in one piece.",
    "{name} is here. It smells of sulphur.",
    "{name} made it out. Not everything does.",
]
# {name}'s hash is the one it should be
verified = [
    "{name}'s hash holds true. It is no demon wearing its face.",
    "The sigils match: {name} is what it claims to be.",
    "{name} passes the trial of the hash, unbroken.",
]
# {name}'s hash isn't
corrupted = [
    "{name} came back wrong. Its hash is a stranger's. Cast it back into the fire.",
    "Something else crawled out wearing {name}'s name. Its hash betrays it.",
]
# {what} is found (a tool, a program) at {place}
found = [
    "{what} lurks at {place}, already damned to this machine.",
    "{what} was waiting at {place}, as the damned always are.",
    "Found {what} at {place}, chained where it was left.",
]
# {name} is unpacked into {place}
unpack = [
    "Prying {name} open over {place}; its insides spill out, still writhing.",
    "Gutting {name} into {place}, file by screaming file.",
    "{name} is split open, and its contents crawl into {place}.",
]
# {what} is copied into {place}
copy = [
    "Carrying {what} to {place} on bleeding knees.",
    "{what} is hauled into {place}, leaving a trail.",
    "Shoving {what} into {place}. It doesn't go quietly.",
    "{what} is nailed into place at {place}.",
]
# {what} is at {place} already, and left alone
skip = [
    "{what} already haunts {place}; the dead are left to rest.",
    "{place} already has {what}. One damnation is enough.",
    "{what} is at {place} already. Even hell doesn't do things twice.",
]
# {what} is linked or set up at {place}
link = [
    "{what} is bound to {place} in a pact that can't be broken.",
    "A thread of blood ties {what} to {place}.",
    "{what} now answers to {place}. It has no choice.",
]
# {place} is put on the PATH
path = [
    "{place} is carved into your PATH, so tdl can be summoned from anywhere.",
    "Your PATH now leads through {place}. All paths lead down, eventually.",
]
# {command} is run
run = [
    "Summoning {command}...",
    "Chanting {command} into the dark...",
    "{command} is called up from below...",
]
# {command} ended well
ran = [
    "{command} answered, and went back to sleep.",
    "{command} did its work and crawled away.",
]
# {problem} happened
problem = [
    "Something screamed in the dark: {problem}",
    "A wall of fire: {problem}",
    "The ground gave way: {problem}",
    "It went wrong, the way things do down here: {problem}",
]
# the install of {what} is over
done = [
    "{what} crawls out of hell, blinking in the light. It is done.",
    "The climb is over. {what} stands, scorched and whole.",
    "Your computer drags itself back up, {what} in its arms. Rest now.",
    "It is finished. {what} is installed, and hell is a little emptier.",
]
# every step is written down at {place}
journal = [
    "Every torment was chronicled in {place}.",
    "The record of this ordeal is kept at {place}.",
    "If you want to relive it, it's all in {place}.",
]
# shortcuts are made for {what} at {place}
shortcut = [
    "{what} is branded onto {place}, a sigil to call it back.",
    "A mark is burned into {place}: {what} answers to it now.",
]

# {what} can be played now, with {command}
ready = [
    "{what} has risen and waits for you. Call it up with: {command}",
    "The ritual is complete: {what} can be played. Speak the words: {command}",
]
# the one question before the install, which always ends in [y/n]
confirm = [
    "Do you consent to the descent? [y/n]",
    "Will you go down into the pit? [y/n]",
    "Sign the pact in blood? [y/n]",
    "The gates are open. Do you step through? [y/n]",
]
# an answer that was neither y nor n
unclear = ["The pit doesn't understand. y or n; after a y, any of the flags above (y --flag ...)"]
# flags given at the question that the script doesn't have: {flags}
unknown_flags = ["No such incantation here: {flags}"]
# the answer was no
declined = [
    "You turn back at the gates. Nothing was done.",
    "The pact goes unsigned. Nothing was done.",
]
# {what} is found running, so {doing}
detected = [
    "{what} stirs in the dark. It is awake, so: {doing}.",
    "Something moves below: {what} is running, so {doing}.",
]
# {what} isn't running, so {instead}
undetected = [
    "{what} sleeps; not a sign of it in the dark. {instead}",
    "No trace of {what} down here. {instead}",
]
# The colour of each event's line, as terminal SGR codes (31 red, 33 yellow, 35 magenta, 1 bold,
# 2 dim; joined with ;): embers and blood. `other` is what other programs print, `section` the
# --- Section --- separators, `warning` the warning before the question.
[colors]
begin = "1;31"
download = "33"
downloaded = "33"
verified = "33"
corrupted = "1;31"
found = "35"
unpack = "35"
copy = "31"
skip = "2;31"
link = "35"
path = "35"
run = "2;33"
ran = "2;33"
problem = "1;31"
done = "1;33"
journal = "2;31"
shortcut = "35"
ready = "1;32"
detected = "1;35"
undetected = "2;33"
confirm = "1;31"
unclear = "33"
unknown_flags = "33"
declined = "2"
other = "2;31"
section = "1;33"
warning = "1;31"

# When another program's lines pour out faster than `threshold` a second, a line under them pulses
# with how hard the machine is labouring: the `frames` in turn, `{bar}` filled by the rate (up to
# `width` cells), throbbing through the `colors`. Only on a terminal; a voice without [strain]
# keeps calm.
[strain]
threshold = 8
width = 16
frames = [
    "♥ {bar} the machine's heart pounds",
    "♡ {bar} the fans scream",
    "♥ {bar} the processor sweats blood",
    "♡ {bar} it cannot stop now",
]
colors = ["1;31", "31", "2;31", "31"]

# What each part of the work is called in its --- Section --- separator
[sections]
warning = "Warning"
build = "The Forge"
pack = "The Ossuary"
install = "The Descent"
download = "The Offering"
setup = "The Binding"
song = "The Hymn"
weapons = "The Armoury of the Damned"
shortcuts = "The Markings"
play = "The Summoning"

# Lines that only repeat what was just said (an empty phrase swallows them: written down, not shown)
[[rewrite]]
pattern = '^(Kept what .* says|Your usual loadout .* is missing.*|Data are loaded, start creating Blender stuff|Failed to register scene update handler|Read blend: .*|doomify: done)$'
phrases = [""]

# cargo's Building bar, redrawn in place
[[rewrite]]
pattern = '^\s*Building (\[[^\]]*\]) (\d+)/(\d+):? ?(.*)$'
phrases = ["The forge roars {1} {2}/{3} {4}"]
color = "33"

# Doomify WaW and its Blender
[[rewrite]]
pattern = '^Pulling from World at War and rendering in Blender \((.*)\)\.\.\.$'
phrases = ["Blender ({1}) is shaken awake to tear the weapons out of World at War and render them"]
color = "35"

[[rewrite]]
pattern = "^Every weapon and sound set is pulled and rendered already, in (.*): World at War and Blender aren't needed"
phrases = ["Every weapon already lies rendered in {1}: World at War and Blender are left to sleep"]
color = "35"

[[rewrite]]
pattern = '^doomify: pulling (\S+)'
phrases = ["Tearing {1} out of World at War's memory"]

[[rewrite]]
pattern = '^doomify: rendering (\S+) pickup'
phrases = ["Painting {1} as it lies on the ground"]

[[rewrite]]
pattern = '^doomify: rendering (\S+) (\S+) (\d+) frames'
phrases = ["Burning {1}'s {2} onto the canvas, {3} frames", "{1}'s {2}: {3} frames seared into being"]

[[rewrite]]
pattern = '^glTF import finished in (\S+)'
phrases = ["A model is dragged up into Blender ({1})"]

[[rewrite]]
pattern = '^Blender quit'
phrases = ["Blender falls silent. Its frames are carried off to be cut into sprites"]
color = "35"

[[rewrite]]
pattern = '^Gathering the sounds into (.*)'
phrases = ["Gathering the screams into {1}"]

[[rewrite]]
pattern = '^Gathered (\d+) sounds'
phrases = ["{1} screams are caught"]

[[rewrite]]
pattern = '^Cutting the renders of (\d+) weapons into sprites, (\d+) at a time'
phrases = ["The renders of {1} weapons go under the knife, {2} at a time"]
color = "35"

[[rewrite]]
pattern = '^Cut (\S+) into (\d+) sprites \((\d+)/(\d+)\)'
phrases = ["{1} is carved into {2} sprites ({3}/{4})", "The knife leaves {1} in {2} pieces ({3}/{4})"]
color = "31"

[[rewrite]]
pattern = '^Writing (\d+) files of code and definitions'
phrases = ["Scrawling {1} files of code and rites"]

[[rewrite]]
pattern = '^Wrote (.*)'
phrases = ["{1} is written, every page of it"]
color = "35"

[[rewrite]]
pattern = '^Packing (.*) into (.*)'
phrases = ["Cramming {1} into {2}"]

[[rewrite]]
pattern = '^Packed (\d+)/(\d+) files'
phrases = ["{1} of {2} bodies crammed into the pit"]

# What other programs print (cargo, git, Blender, tdl...), rewritten: the first rule whose
# `pattern` (a regex) matches a line gives one of its `phrases`, `{1}`, `{2}`... being the
# pattern's groups and `{line}` the whole line, in `color` (else `other`'s).
[[rewrite]]
pattern = '^\s*Compiling (\S+) v(\S+)'
phrases = [
    "Forging {1} {2} in the furnace",
    "Hammering {1} {2} into shape on the anvil",
    "{1} {2} is thrown into the fire",
    "Smelting {1} {2} down from raw ore",
]
color = "2;33"

[[rewrite]]
pattern = '^\s*Finished `?(\S+?)`? profile.* in (\S+)'
phrases = ["The forge cools: the {1} build is done, {2} in the flames"]
color = "33"

[[rewrite]]
pattern = '^\s*(?:Downloading|Downloaded) (\S+) v(\S+)'
phrases = ["Prying {1} {2} loose from the crates below", "{1} {2} is dug up from the registry's grave"]
color = "2;33"

[[rewrite]]
pattern = '^\s*(?:Updating|Locking|Adding|Fetching|Checking|Blocking|Packaging|Running|Installing|Replacing|Installed) (.*)'
phrases = ["The machine grinds on: {line}"]

[[rewrite]]
pattern = '^\s*warning: (.*)'
phrases = ["A whisper of warning from the forge: {1}"]
color = "33"

[[rewrite]]
pattern = '^\s*error(?:\[\w+\])?: (.*)'
phrases = ["The forge spits blood: {1}"]
color = "1;31"

[[rewrite]]
pattern = '^Fra:(\d+)'
phrases = ["Frame {1} is seared onto the canvas"]

[[rewrite]]
pattern = "^Saved: '?(.*?)'?$"
phrases = ["{1} is branded and kept"]

[[rewrite]]
pattern = "^Cloning into '(.*)'"
phrases = ["Tearing a copy of {1} out of the wire"]

[[rewrite]]
pattern = '^Made the profile (.*)'
phrases = ["The profile {1} rises from the ground"]
color = "35"

[[rewrite]]
pattern = '^Took again the wads of the profile (.*)'
phrases = ["The profile {1} is fed its wads once more"]
color = "35"

[[rewrite]]
pattern = '^Playing (.*) from now on'
phrases = ["{1} will play from now on: the hymn of the damned"]
color = "35"

[[rewrite]]
pattern = '^Kept what (.*) says'
phrases = ["The pact in {1} is sealed into tdl"]
color = "35"

# Any other line: still from below
[fallback]
format = "  ⸸ {line}"
