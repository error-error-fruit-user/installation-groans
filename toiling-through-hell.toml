# Toiling Through Hell: the install as your computer's descent through hell, dragging each file up
# out of the pit on its hands and knees. The voice installers speak in unless told --computer-speak.
#
# Every event is a list of phrases; each time it happens one is picked at random. The installer
# fills in the {placeholders} each event lists; a phrase can leave any of them out.
version = 1
name = "Toiling Through Hell"

# Now and then, after a step, something else speaks through the machine: `chance` of the time (0
# to 1), in `color` (red, yellow, green, blue, magenta, cyan, white), one of its `phrases`.
[interjection]
chance = 0.03
color = "red"
phrases = ["MUST COMPLETE THE RITUAL"]

[phrases]
# {what} is being installed in {place}
begin = [
    "Your computer takes its first step into the pit, bound for {place}, to install {what}.",
    "The gates groan open. {what} is somewhere below; {place} is where it must be dragged.",
    "Abandon all idle cycles, ye who enter here: installing {what} in {place}.",
    "The fans spin up like a dying breath. Down we go, to raise {what} in {place}.",
    "Somewhere a hard drive weeps. {what} is coming to {place}, whether it likes it or not.",
]
# {name} is downloaded, {size} of it
download = [
    "Hauling {name} up from the depths, {size} of it, link by burning link...",
    "Clawing {name} out of the wire, {size} heavier with every packet...",
    "The network howls. {name} ({size}) is torn from it one byte at a time...",
    "Dragging {name} through the fire, all {size} of it...",
    "A chain of {size} rattles up out of the dark: {name}, coming...",
]
# {name} arrived whole
downloaded = [
    "{name} crawls out of the pit, scorched but in one piece.",
    "{name} is here. It smells of sulphur.",
    "{name} made it out. Not everything does.",
]
# {name}'s hash is the one it should be
verified = [
    "{name}'s hash holds true. It is no demon wearing its face.",
    "The sigils match: {name} is what it claims to be.",
    "{name} passes the trial of the hash, unbroken.",
]
# {name}'s hash isn't
corrupted = [
    "{name} came back wrong. Its hash is a stranger's. Cast it back into the fire.",
    "Something else crawled out wearing {name}'s name. Its hash betrays it.",
]
# {what} is found (a tool, a program) at {place}
found = [
    "{what} lurks at {place}, already damned to this machine.",
    "{what} was waiting at {place}, as the damned always are.",
    "Found {what} at {place}, chained where it was left.",
]
# {name} is unpacked into {place}
unpack = [
    "Prying {name} open over {place}; its insides spill out, still writhing.",
    "Gutting {name} into {place}, file by screaming file.",
    "{name} is split open, and its contents crawl into {place}.",
]
# {what} is copied into {place}
copy = [
    "Carrying {what} to {place} on bleeding knees.",
    "{what} is hauled into {place}, leaving a trail.",
    "Shoving {what} into {place}. It doesn't go quietly.",
    "{what} is nailed into place at {place}.",
]
# {what} is at {place} already, and left alone
skip = [
    "{what} already haunts {place}; the dead are left to rest.",
    "{place} already has {what}. One damnation is enough.",
    "{what} is at {place} already. Even hell doesn't do things twice.",
]
# {what} is linked or set up at {place}
link = [
    "{what} is bound to {place} in a pact that can't be broken.",
    "A thread of blood ties {what} to {place}.",
    "{what} now answers to {place}. It has no choice.",
]
# {place} is put on the PATH
path = [
    "{place} is carved into your PATH, so tdl can be summoned from anywhere.",
    "Your PATH now leads through {place}. All paths lead down, eventually.",
]
# {command} is run
run = [
    "Summoning {command}...",
    "Chanting {command} into the dark...",
    "{command} is called up from below...",
]
# {command} ended well
ran = [
    "{command} answered, and went back to sleep.",
    "{command} did its work and crawled away.",
]
# {problem} happened
problem = [
    "Something screamed in the dark: {problem}",
    "A wall of fire: {problem}",
    "The ground gave way: {problem}",
    "It went wrong, the way things do down here: {problem}",
]
# the install of {what} is over
done = [
    "{what} crawls out of hell, blinking in the light. It is done.",
    "The climb is over. {what} stands, scorched and whole.",
    "Your computer drags itself back up, {what} in its arms. Rest now.",
    "It is finished. {what} is installed, and hell is a little emptier.",
]
# every step is written down at {place}
journal = [
    "Every torment was chronicled in {place}.",
    "The record of this ordeal is kept at {place}.",
    "If you want to relive it, it's all in {place}.",
]
